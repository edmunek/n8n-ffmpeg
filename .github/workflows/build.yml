name: build-n8n-ffmpeg

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja n8n (puste = latest z Docker Hub)'
        required: false
        default: ''
  push:
    paths: ['Dockerfile', '.github/workflows/build.yml']

env:
  IMG: ghcr.io/edmunek/n8n-ffmpeg
  BASE: n8nio/n8n

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Wersja z API Docker Hub - bez pullowania obrazu (nie zuzywa limitu pulli)
      - name: Ustal wersje n8n
        id: v
        run: |
          set -euo pipefail
          HUB="https://hub.docker.com/v2/repositories/$BASE/tags"
          REQ="${{ inputs.version }}"

          if [ -n "$REQ" ]; then
            VERSION="$REQ"
            echo "Wersja podana recznie: $VERSION"
          else
            DIGEST=$(curl -fsS --retry 3 --retry-delay 10 "$HUB/latest" | jq -r '.digest // empty')
            if [ -z "$DIGEST" ]; then echo "BLAD: brak digestu dla $BASE:latest"; exit 1; fi

            # n8n publikuje teraz ~50 tagow dziennie (v3-nightly, v3-rc, *-pc, *-amd64/arm64),
            # wiec tag x.y.z dla latest szybko wypada z pierwszej strony. Przegladamy do 10 stron.
            VERSION=""
            URL="$HUB?page_size=100&ordering=last_updated"
            for PAGE in $(seq 1 10); do
              [ -z "$URL" ] && break
              RESP=$(curl -fsS --retry 3 --retry-delay 10 "$URL")
              VERSION=$(printf '%s' "$RESP" \
                        | jq -r --arg d "$DIGEST" '.results[] | select(.digest == $d) | .name' \
                        | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
              [ -n "$VERSION" ] && { echo "Znaleziono na stronie $PAGE"; break; }
              URL=$(printf '%s' "$RESP" | jq -r '.next // empty')
            done

            if [ -z "$VERSION" ]; then
              if [ "${{ github.event_name }}" = "schedule" ]; then
                echo "::warning::Nie znaleziono wersji dla digestu $DIGEST w 10 stronach tagow, pomijam ten run"
                echo "version=" >> "$GITHUB_OUTPUT"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "BLAD: nie znaleziono wersji dla digestu $DIGEST"; exit 1
            fi
            echo "Docker Hub latest = $VERSION ($DIGEST)"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "schedule" ] \
             && docker manifest inspect "$IMG:$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Wersja $VERSION juz zbudowana - pomijam (bez zadnego pulla z Docker Hub)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Zalogowany pull: osobny limit konta zamiast wspolnego limitu IP runnera
      - uses: docker/login-action@v3
        if: steps.v.outputs.skip == 'false'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pobierz baze i odczytaj Alpine
        id: base
        if: steps.v.outputs.skip == 'false'
        run: |
          set -uo pipefail
          V="${{ steps.v.outputs.version }}"

          PULLED=0
          for i in 1 2 3; do
            if docker pull -q "$BASE:$V"; then PULLED=1; break; fi
            echo "pull nieudany (proba $i) - czekam 60s"
            sleep 60
          done
          if [ "$PULLED" != "1" ]; then echo "BLAD: nie udalo sie pobrac $BASE:$V"; exit 1; fi

          REAL=$(docker run --rm "$BASE:$V" n8n --version | tr -d '\r')
          if [ "$REAL" != "$V" ]; then echo "BLAD: obraz $BASE:$V zglasza wersje '$REAL'"; exit 1; fi

          RAW=$(docker run --rm --entrypoint sh "$BASE:$V" -c 'cat /etc/alpine-release' 2>/dev/null || true)
          ALPINE=$(printf '%s' "$RAW" | tr -d '\r' | cut -d. -f1,2)
          if [ -z "$ALPINE" ]; then
            ALPINE=3.22
            echo "UWAGA: nie odczytano wersji Alpine, uzywam fallbacku $ALPINE"
          fi

          echo "n8n=$V alpine=$ALPINE"
          echo "alpine=$ALPINE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.skip == 'false'

      - name: Build
        if: steps.v.outputs.skip == 'false'
        run: |
          set -uo pipefail
          OK=0
          for i in 1 2 3 4; do
            echo "=== Proba $i ==="
            if docker buildx build \
                 --platform linux/arm64 \
                 --build-arg N8N_IMAGE="$BASE" \
                 --build-arg N8N_VERSION=${{ steps.v.outputs.version }} \
                 --build-arg ALPINE_VERSION=${{ steps.base.outputs.alpine }} \
                 --label org.opencontainers.image.version=${{ steps.v.outputs.version }} \
                 --cache-from type=gha \
                 --cache-to type=gha,mode=max \
                 --tag n8n-ffmpeg:test \
                 --load . ; then
              OK=1; break
            fi
            echo "Nieudana - czekam 90s przed kolejna proba"
            sleep 90
          done
          if [ "$OK" != "1" ]; then echo "BLAD: build nie powiodl sie po 4 probach"; exit 1; fi

      - name: Smoke test
        if: steps.v.outputs.skip == 'false'
        run: |
          docker run --rm --entrypoint ffmpeg  n8n-ffmpeg:test -version | head -1
          docker run --rm --entrypoint ffprobe n8n-ffmpeg:test -version | head -1
          docker run --rm --entrypoint magick  n8n-ffmpeg:test -version | head -1
          docker run --rm n8n-ffmpeg:test n8n --version
          docker run --rm --entrypoint id n8n-ffmpeg:test -un | grep -qx node
          if docker run --rm --entrypoint sh n8n-ffmpeg:test -c 'ls /sbin/apk' 2>/dev/null; then
            echo "BLAD: apk zostal w obrazie"; exit 1
          fi
          echo "Smoke test OK"

      - name: Push
        if: steps.v.outputs.skip == 'false'
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          docker tag n8n-ffmpeg:test "$IMG:$V"
          docker tag n8n-ffmpeg:test "$IMG:latest"
          docker push "$IMG:$V"
          docker push "$IMG:latest"
          echo "Wypchniete: $IMG:$V oraz $IMG:latest"
