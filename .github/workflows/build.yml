name: build-n8n-ffmpeg

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
  push:
    paths: ['Dockerfile', '.github/workflows/build.yml']

env:
  IMG: ghcr.io/edmunek/n8n-ffmpeg
  BASE: n8nio/n8n

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Odczytaj wersje bazowe
        id: v
        run: |
          set -uo pipefail

          PULLED=0
          for i in 1 2 3; do
            if docker pull -q "$BASE:latest"; then PULLED=1; break; fi
            echo "pull nieudany (proba $i) - czekam 60s"
            sleep 60
          done
          if [ "$PULLED" != "1" ]; then echo "BLAD: nie udalo sie pobrac $BASE:latest"; exit 1; fi

          VERSION=$(docker run --rm "$BASE:latest" n8n --version)
          if [ -z "$VERSION" ]; then echo "BLAD: pusta wersja n8n"; exit 1; fi

          echo "--- diagnostyka bazy ---"
          docker run --rm --entrypoint sh "$BASE:latest" \
            -c 'cat /etc/os-release 2>&1 | head -3; echo "alpine-release:"; cat /etc/alpine-release 2>&1' || true
          echo "--- koniec diagnostyki ---"

          RAW=$(docker run --rm --entrypoint sh "$BASE:latest" \
                -c 'cat /etc/alpine-release' 2>/dev/null || true)
          ALPINE=$(printf '%s' "$RAW" | tr -d '\r' | cut -d. -f1,2)
          if [ -z "$ALPINE" ]; then
            ALPINE=3.22
            echo "UWAGA: nie odczytano wersji Alpine, uzywam fallbacku $ALPINE"
          fi

          echo "n8n=$VERSION alpine=$ALPINE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "alpine=$ALPINE"   >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "schedule" ] \
             && docker manifest inspect "$IMG:$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Wersja $VERSION juz zbudowana - pomijam."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.skip == 'false'

      - name: Build
        if: steps.v.outputs.skip == 'false'
        run: |
          set -uo pipefail
          OK=0
          for i in 1 2 3 4; do
            echo "=== Proba $i ==="
            if docker buildx build \
                 --platform linux/arm64 \
                 --build-arg N8N_IMAGE="$BASE" \
                 --build-arg N8N_VERSION=${{ steps.v.outputs.version }} \
                 --build-arg ALPINE_VERSION=${{ steps.v.outputs.alpine }} \
                 --label org.opencontainers.image.version=${{ steps.v.outputs.version }} \
                 --cache-from type=gha \
                 --cache-to type=gha,mode=max \
                 --tag n8n-ffmpeg:test \
                 --load . ; then
              OK=1; break
            fi
            echo "Nieudana - czekam 90s przed kolejna proba"
            sleep 90
          done
          if [ "$OK" != "1" ]; then echo "BLAD: build nie powiodl sie po 4 probach"; exit 1; fi

      - name: Smoke test
        if: steps.v.outputs.skip == 'false'
        run: |
          docker run --rm --entrypoint ffmpeg  n8n-ffmpeg:test -version | head -1
          docker run --rm --entrypoint ffprobe n8n-ffmpeg:test -version | head -1
          docker run --rm --entrypoint magick  n8n-ffmpeg:test -version | head -1
          docker run --rm n8n-ffmpeg:test n8n --version
          docker run --rm --entrypoint id n8n-ffmpeg:test -un | grep -qx node
          if docker run --rm --entrypoint sh n8n-ffmpeg:test -c 'ls /sbin/apk' 2>/dev/null; then
            echo "BLAD: apk zostal w obrazie"; exit 1
          fi
          echo "Smoke test OK"

      - name: Push
        if: steps.v.outputs.skip == 'false'
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          docker tag n8n-ffmpeg:test "$IMG:$V"
          docker tag n8n-ffmpeg:test "$IMG:latest"
          docker push "$IMG:$V"
          docker push "$IMG:latest"
          echo "Wypchniete: $IMG:$V oraz $IMG:latest"
