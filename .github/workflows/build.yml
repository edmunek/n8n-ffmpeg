name: build-n8n-ffmpeg

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths: ['Dockerfile', '.github/workflows/build.yml']

env:
  IMG: ghcr.io/edmunek/n8n-ffmpeg

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

       - name: Odczytaj wersje bazowe
        id: v
        run: |
          set -uo pipefail
          docker pull -q docker.n8n.io/n8nio/n8n:latest

          VERSION=$(docker run --rm docker.n8n.io/n8nio/n8n:latest n8n --version)
          if [ -z "$VERSION" ]; then echo "BLAD: pusta wersja n8n"; exit 1; fi

          echo "--- diagnostyka bazy ---"
          docker run --rm --entrypoint sh docker.n8n.io/n8nio/n8n:latest \
            -c 'cat /etc/os-release 2>&1 | head -3; echo "alpine-release:"; cat /etc/alpine-release 2>&1' || true
          echo "--- koniec diagnostyki ---"

          RAW=$(docker run --rm --entrypoint sh docker.n8n.io/n8nio/n8n:latest \
                -c 'cat /etc/alpine-release' 2>/dev/null || true)
          ALPINE=$(printf '%s' "$RAW" | tr -d '\r' | cut -d. -f1,2)
          if [ -z "$ALPINE" ]; then
            ALPINE=3.22
            echo "UWAGA: nie odczytano wersji Alpine, uzywam fallbacku $ALPINE"
          fi

          echo "n8n=$VERSION alpine=$ALPINE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "alpine=$ALPINE"   >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "schedule" ] \
             && docker manifest inspect "$IMG:$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Wersja $VERSION juz zbudowana - pomijam."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.skip == 'false'

      - name: Build
        if: steps.v.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: n8n-ffmpeg:test
          build-args: |
            N8N_VERSION=${{ steps.v.outputs.version }}
            ALPINE_VERSION=${{ steps.v.outputs.alpine }}
          labels: org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: steps.v.outputs.skip == 'false'
        run: |
          docker run --rm --entrypoint ffmpeg  n8n-ffmpeg:test -version | head -1
          docker run --rm --entrypoint ffprobe n8n-ffmpeg:test -version | head -1
          docker run --rm --entrypoint magick  n8n-ffmpeg:test -version | head -1
          docker run --rm n8n-ffmpeg:test n8n --version
          docker run --rm --entrypoint id n8n-ffmpeg:test -un | grep -qx node
          if docker run --rm --entrypoint sh n8n-ffmpeg:test -c 'ls /sbin/apk' 2>/dev/null; then
            echo "BLAD: apk zostal w obrazie"; exit 1
          fi
          echo "Smoke test OK"

      - name: Push
        if: steps.v.outputs.skip == 'false'
        run: |
          V="${{ steps.v.outputs.version }}"
          docker tag n8n-ffmpeg:test "$IMG:$V"
          docker tag n8n-ffmpeg:test "$IMG:latest"
          docker push "$IMG:$V"
          docker push "$IMG:latest"
          echo "Wypchniete: $IMG:$V oraz $IMG:latest"
